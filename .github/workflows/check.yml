name: Check build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from src
        run: sh build.sh
      - name: Built files must match src
        run: |
          if ! git diff --quiet -- index.html artifact.html guide/index.html; then
            echo "::error::index.html, artifact.html or guide/index.html is out of date. Run ./build.sh and commit the result."
            git diff --stat -- index.html artifact.html guide/index.html
            exit 1
          fi
      - name: Scripts must parse
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["index.html", "guide/index.html"]) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
              console.log(f, "ok");
            }'
