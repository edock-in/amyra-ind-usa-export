name: Deploy to GitHub Pages

# Publishes the game every time main changes. Only the maintainer can change main.
# Runs only when the repository variable DEPLOY_TO_GITHUB_PAGES is "true"
# and Settings > Pages > Source is set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_TO_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _site/guide
          cp index.html _site/index.html
          cp guide/index.html _site/guide/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
